# Postgres y almacenamiento S3 locales para desarrollo y tests: `docker compose up -d`.
# Usuario, contraseña y BD coinciden con el ejemplo de .env.example. Si ya tienes otro
# Postgres en el 5432, cambia el puerto con POSTGRES_PORT=5433 (y ajústalo en .env.local).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: gestor_tareas_dev
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Crea también la BD de tests de integración al arrancar por primera vez.
      - ./prisma/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev -d gestor_tareas_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  # Simulador de S3 para los adjuntos en local (crea el bucket al arrancar). Ojo: no valida
  # las firmas de las URLs; eso solo lo comprueba un proveedor real (R2, Supabase, S3).
  s3:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: gestor-tareas
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
    ports:
      - '${S3_PORT:-9090}:9090'
    volumes:
      - s3-data:/tmp/s3mock

volumes:
  postgres-data:
  s3-data:
